{% extends "layouts/base.html" %}

{% block title %} Book List {% endblock title %}

{% block content %}

<h2>Search Results</h2>

{% for book in books %}

    <p>
        <strong>Title:</strong> {{ book.title }} <br>
        <strong>Author:</strong> {{ book.author }}
    </p>

    <hr>

{% empty %}

    <p>No books found.</p>

{% endfor %}

{% endblock content %}
